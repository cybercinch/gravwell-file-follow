name: Go Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Build/push lives in docker-base-images (gitea), not here — this repo is
# only the source that its `source_repo` config clones and builds from.
# This workflow is test-only and needs no Docker Hub secrets.
jobs:
  test:
    name: Go unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: watcher/go.mod
          cache-dependency-path: watcher/go.sum

      - name: Run tests
        run: go test ./... -v -race -count=1
